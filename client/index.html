<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ThreadMap Clone</title>
        <!-- Fuente Serif para títulos -->
        <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
        <!-- Iconos FontAwesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="chat-container">
            <div id="messages">
                <div class="message bot-message">
                    ¡Hola! Soy tu primer robot. Aún no soy muy listo, pero
                    aprendo rápido.
                </div>
            </div>

            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Escribe algo aquí..."
                />
                <button>Enviar</button>
            </div>
        </div>

        <script type="module" src="pruebas.js"></script>
    </body>
</html>
